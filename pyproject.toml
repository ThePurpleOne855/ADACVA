[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "ada-piano-teacher"
version = "0.1.0"
description = "Accessible piano learning prototype with independent camera and MIDI checks"
requires-python = ">=3.11"
dependencies = []

[project.optional-dependencies]
camera = ["opencv-python>=4.10,<5"]
midi = ["mido>=1.3,<2", "python-rtmidi>=1.5,<2"]
speech = ["pyttsx3>=2.98,<3"]
hardware = ["opencv-python>=4.10,<5", "mido>=1.3,<2", "python-rtmidi>=1.5,<2", "pyttsx3>=2.98,<3"]

[project.scripts]
ada-piano = "ada_piano.cli:main"

[tool.setuptools.packages.find]
include = ["ada_piano*"]

[tool.setuptools.package-data]
ada_piano = ["exercises/*.json", "exercises/*.musicxml"]
