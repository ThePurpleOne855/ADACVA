[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "ada-piano-teacher"
version = "0.1.0"
description = "Accessible piano learning prototype with independent camera and MIDI checks"
requires-python = ">=3.11"
dependencies = []

[project.optional-dependencies]
camera = ["opencv-python>=4.10,<5", "mediapipe>=0.10,<0.11"]
midi = ["mido>=1.3,<2", "python-rtmidi>=1.5,<2"]
speech = [] # Native system speech; install espeak-ng on Linux.
agent = ["openai>=3.28,<4"]
hardware = ["ada-piano-teacher[camera,midi,speech]"]

[project.scripts]
ada-piano = "ada_piano.cli:main"

[tool.setuptools.packages.find]
include = ["ada_piano*"]

[tool.setuptools.package-data]
ada_piano = ["exercises/*.json", "exercises/*.musicxml", "pieces/*.json", "pieces/*.musicxml", "pieces/*.mxl"]

[tool.pyright]
venvPath = "."
venv = ".venv"
pythonVersion = "3.12"
